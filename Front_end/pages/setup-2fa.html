<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digital Wallet — Setup 2FA</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">

  <style>
    body {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; background: 
        radial-gradient(1200px 800px at 80% 100%, rgba(230, 60, 194, 0.18), transparent 60%),
        radial-gradient(900px 700px at 10% 0%, rgba(124, 58, 237, 0.22), transparent 55%),
        linear-gradient(180deg, #0b0616, #140a24);
      padding: 20px;
    }
    .setup-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--stroke-strong);
      border-radius: 24px;
      max-width: 800px; width: 100%;
      display: grid; grid-template-columns: 1fr 1fr;
      overflow: hidden;
      box-shadow: 0 30px 80px -20px rgba(70, 10, 120, 0.6);
    }
    .setup-left {
      padding: 40px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      border-right: 1px solid var(--stroke);
      background: linear-gradient(180deg, rgba(124, 58, 237, 0.05), transparent);
    }
    .setup-right {
      padding: 40px;
      display: flex; flex-direction: column; justify-content: center;
    }
    .qr-wrapper {
      background: #fff; padding: 16px; border-radius: 16px;
      box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
      position: relative;
    }
    .qr-wrapper img { width: 200px; height: 200px; display: block; }
    .secret-code {
      margin-top: 16px; font-family: monospace; font-size: 13px;
      color: var(--text-low); background: rgba(255,255,255,0.05);
      padding: 8px 12px; border-radius: 8px; letter-spacing: 1px;
    }
    .setup-right h1 {
      font-family: 'Sora'; font-size: 24px; margin-bottom: 10px;
    }
    .setup-right p {
      color: var(--text-mid); font-size: 14px; line-height: 1.6; margin-bottom: 24px;
    }
    .step-list { margin-bottom: 30px; display: flex; flex-direction: column; gap: 12px; }
    .step-item { display: flex; gap: 12px; font-size: 13.5px; color: var(--text-hi); align-items: center; }
    .step-icon {
      width: 28px; height: 28px; border-radius: 50%;
      background: rgba(168, 120, 255, 0.15); color: var(--violet-1);
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700; flex-shrink: 0;
    }
    .otp-input-container { margin-bottom: 24px; }
    .otp-input {
      width: 100%; padding: 16px; text-align: center;
      font-size: 24px; letter-spacing: 8px; font-family: monospace;
      background: var(--field-bg); border: 1px solid var(--stroke);
      border-radius: 12px; color: var(--text-hi); outline: none;
      transition: 0.2s;
    }
    .otp-input:focus {
      border-color: var(--magenta); box-shadow: 0 0 0 3px rgba(230, 60, 194, 0.15);
    }
    @media (max-width: 768px) {
      .setup-card { grid-template-columns: 1fr; }
      .setup-left { border-right: none; border-bottom: 1px solid var(--stroke); padding: 30px; }
      .setup-right { padding: 30px; }
    }
  </style>
</head>
<body>

<div class="setup-card">
  <!-- LEFT: QR CODE -->
  <div class="setup-left">
    <div class="qr-wrapper" id="qrContainer">
      <div class="spinner" style="border-top-color: #000; width: 30px; height: 30px;"></div>
    </div>
    <div class="secret-code" id="secretText">Loading...</div>
  </div>

  <!-- RIGHT: INSTRUCTIONS & INPUT -->
  <div class="setup-right">
    <h1>Secure your account</h1>
    <p>Two-Factor Authentication adds an extra layer of security to your wallet.</p>

    <div class="step-list">
      <div class="step-item"><div class="step-icon">1</div> Scan the QR code with Google Authenticator</div>
      <div class="step-item"><div class="step-icon">2</div> Enter the 6-digit code generated below</div>
    </div>

    <div id="alertBox" style="display:none; padding:10px; border-radius:8px; background:rgba(248,113,113,0.1); color:var(--danger); font-size:13px; margin-bottom:16px;"></div>

    <div class="otp-input-container">
      <label style="font-size:12px; font-weight:600; color:var(--text-mid); display:block; margin-bottom:8px;">Verification Code</label>
      <input type="text" class="otp-input" id="otpCode" placeholder="000000" maxlength="6" autocomplete="off">
    </div>

    <button class="btn btn-primary" id="verifyBtn" style="width:100%; padding:14px; border-radius:12px;">
      <i class="bi bi-shield-check"></i> Enable 2FA
    </button>
    
    <a href="dashboard.html" style="display:block; text-align:center; margin-top:16px; font-size:13px; color:var(--text-low); text-decoration:none;">Cancel and go back</a>
  </div>
</div>

<script>
  const API_BASE = 'https://api.digitalwallet.dpdns.org/api';
  let token = localStorage.getItem('accessToken');

  document.addEventListener('DOMContentLoaded', async () => {
    if (!token) { window.location.href = 'login.html'; return; }

    try {
      const res = await fetch(`${API_BASE}/auth/2fa/setup`, {
        method: 'POST',
        headers: { Authorization: `Bearer ${token}` }
      });
      const data = await res.json();
      
      if (data.success) {
        document.getElementById('qrContainer').innerHTML = `<img src="${data.data.qrCodeUrl}" alt="QR Code">`;
        document.getElementById('secretText').textContent = data.data.secret;
      }
    } catch (err) {
      console.error('Failed to load 2FA setup');
    }
  });

  document.getElementById('verifyBtn').addEventListener('click', async () => {
    const code = document.getElementById('otpCode').value;
    const errBox = document.getElementById('alertBox');
    if (code.length !== 6) { 
      errBox.textContent = 'Please enter a 6-digit code.';
      errBox.style.display = 'block';
      return; 
    }

    const btn = this;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner" style="border-top-color:#fff;"></span> Verifying...';

    try {
      const res = await fetch(`${API_BASE}/auth/2fa/verify`, {
        method: 'POST',
        headers: { 
          'Content-Type': 'application/json',
          Authorization: `Bearer ${token}` 
        },
        body: JSON.stringify({ code })
      });
      const data = await res.json();

      if (res.ok) {
        const user = JSON.parse(localStorage.getItem('user') || '{}');
        user.twoFAEnabled = true;
        localStorage.setItem('user', JSON.stringify(user));
        
        // Show success state
        document.querySelector('.setup-right').innerHTML = `
          <div style="text-align:center;">
            <div style="width:64px; height:64px; background:rgba(94,234,154,0.1); color:var(--success); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:32px; margin:0 auto 16px;">
              <i class="bi bi-check-lg"></i>
            </div>
            <h2 style="font-family:'Sora'; margin-bottom:8px;">All set!</h2>
            <p style="margin-bottom:24px;">2FA is now active on your account.</p>
            <a href="dashboard.html" class="btn btn-primary" style="display:inline-flex;">Go to Dashboard</a>
          </div>
        `;
      } else {
        errBox.textContent = data.message || 'Invalid code';
        errBox.style.display = 'block';
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-shield-check"></i> Enable 2FA';
      }
    } catch (err) {
      errBox.textContent = 'Network error';
      errBox.style.display = 'block';
      btn.disabled = false;
      btn.innerHTML = '<i class="bi bi-shield-check"></i> Enable 2FA';
    }
  });
</script>
</body>
</html>
