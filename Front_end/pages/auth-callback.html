<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signing you in… — SplitWise</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Global Styles -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body>

<div class="auth-container">
  <a href="../index.html" class="brand">
    <span class="brand-mark"><i class="bi bi-wallet2"></i></span>
    SplitWise
  </a>

  <div class="auth-card">
    <div class="auth-header">
      <div class="icon-badge"><i class="bi bi-google"></i></div>
      <h1 id="statusTitle">Signing you in…</h1>
      <p id="statusMessage">Please wait while we complete Google authentication.</p>
    </div>
    <div id="alert-container"></div>
  </div>
</div>

<script>
(function handleGoogleCallback() {
  const params       = new URLSearchParams(window.location.search);
  const accessToken  = params.get('accessToken');
  const refreshToken = params.get('refreshToken');
  const error        = params.get('error');
  const userJson     = params.get('user');
  const walletJson   = params.get('wallet');

  const titleEl = document.getElementById('statusTitle');
  const msgEl   = document.getElementById('statusMessage');

  // ❌ Error from backend
  if (error) {
    titleEl.textContent = 'Google sign-in failed';
    msgEl.textContent   = 'Redirecting back to login…';
    setTimeout(() => {
      window.location.href = 'login.html?error=' + encodeURIComponent(error);
    }, 1500);
    return;
  }

  // ❌ Missing tokens
  if (!accessToken || !refreshToken) {
    titleEl.textContent = 'Something went wrong';
    msgEl.textContent   = 'No tokens received. Redirecting to login…';
    setTimeout(() => window.location.href = 'login.html', 1500);
    return;
  }

  // ✅ Store tokens the same way email/password login does
  localStorage.setItem('accessToken',  accessToken);
  localStorage.setItem('refreshToken', refreshToken);
  if (userJson)   localStorage.setItem('user',   decodeURIComponent(userJson));
  if (walletJson) localStorage.setItem('wallet', decodeURIComponent(walletJson));

  // Also mirror into sessionStorage as a safety net (some of your code may use it)
  sessionStorage.setItem('accessToken', accessToken);

  titleEl.textContent = '✅ Signed in!';
  msgEl.textContent   = 'Redirecting to your dashboard…';

  const redirect = localStorage.getItem('auth_redirect') || 'dashboard.html';
  localStorage.removeItem('auth_redirect');

  setTimeout(() => {
    window.location.href = redirect;
  }, 800);
})();
</script>

</body>
</html>
