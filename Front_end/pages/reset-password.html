<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SplitWise — Reset Password</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Global Styles -->
  <link rel="stylesheet" href="../css/style.css">

  <!-- Auth Styles -->
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body>

<div class="auth-container">

  <!-- ===== BRAND ===== -->
  <a href="../index.html" class="brand">
    <span class="brand-mark"><i class="bi bi-wallet2"></i></span>
    SplitWise
  </a>

  <!-- ===== AUTH CARD ===== -->
  <div class="auth-card">

    <!-- ===== HEADER ===== -->
    <div class="auth-header">
      <div class="icon-badge"><i class="bi bi-shield-lock"></i></div>
      <h1>Reset Password</h1>
      <p>Enter the OTP and your new password</p>
    </div>

    <!-- ===== ALERT CONTAINER ===== -->
    <div id="alert-container"></div>

    <!-- ===== FORM ===== -->
    <form id="resetForm" class="auth-form">

      <!-- Email (readonly) -->
      <div class="field">
        <label for="email">Email Address</label>
        <div class="input-wrap">
          <i class="bi bi-envelope leading"></i>
          <input type="email" id="email" placeholder="Your email" readonly />
        </div>
      </div>

      <!-- OTP -->
      <div class="field">
        <label for="otp">Enter OTP</label>
        <div class="input-wrap">
          <i class="bi bi-key leading"></i>
          <input type="text" id="otp" placeholder="6-digit OTP" maxlength="6" required autofocus />
        </div>
      </div>

      <!-- New Password -->
      <div class="field">
        <label for="newPassword">New Password</label>
        <div class="input-wrap">
          <i class="bi bi-lock leading"></i>
          <input type="password" id="newPassword" placeholder="Create new password" required />
          <button type="button" class="toggle-eye" data-target="newPassword" aria-label="Show password">
            <i class="bi bi-eye"></i>
          </button>
        </div>
      </div>

      <!-- Confirm Password -->
      <div class="field">
        <label for="confirmPassword">Confirm Password</label>
        <div class="input-wrap">
          <i class="bi bi-lock leading"></i>
          <input type="password" id="confirmPassword" placeholder="Confirm new password" required />
          <button type="button" class="toggle-eye" data-target="confirmPassword" aria-label="Show password">
            <i class="bi bi-eye"></i>
          </button>
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn btn-primary btn-block" id="resetBtn" style="margin-top: 8px;">
        <i class="bi bi-check-circle"></i> Reset Password
      </button>

    </form>

    <!-- ===== RESEND LINK ===== -->
    <div class="resend-link" style="text-align: center; font-size: 13px; color: var(--text-mid); margin-top: 16px;">
      Didn't receive OTP? <a id="resendOtpLink" style="color: var(--magenta); font-weight: 600; cursor: pointer; text-decoration: none;">Resend OTP</a>
    </div>

    <!-- ===== FOOTER ===== -->
    <div class="auth-footer">
      <a href="login.html">Back to Login</a>
    </div>

  </div>
</div>

<!-- ========================================
   SCRIPTS
======================================== -->
<script>
  // ============================================
  // LOAD EMAIL FROM LOCALSTORAGE
  // ============================================
  const resetEmail = localStorage.getItem('resetEmail');

  if (resetEmail) {
    document.getElementById('email').value = resetEmail;
  } else {
    showAlert('❌ No reset session found. Please try again.', 'error');
    setTimeout(() => {
      window.location.href = 'forgot-password.html';
    }, 2000);
  }

  // ============================================
  // AUTO-FOCUS OTP FIELD
  // ============================================
  document.getElementById('otp').focus();

  // ============================================
  // PASSWORD TOGGLE
  // ============================================
  document.querySelectorAll('.toggle-eye').forEach(btn => {
    btn.addEventListener('click', function() {
      const input = document.getElementById(this.dataset.target);
      const icon = this.querySelector('i');
      if (input) {
        if (input.type === 'password') {
          input.type = 'text';
          icon.className = 'bi bi-eye';
        } else {
          input.type = 'password';
          icon.className = 'bi bi-eye-slash';
        }
      }
    });
  });

  // ============================================
  // FORM SUBMIT - RESET PASSWORD
  // ============================================
  document.getElementById('resetForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const email = document.getElementById('email').value;
    const otp = document.getElementById('otp').value.trim();
    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    // ============================================
    // FRONTEND VALIDATION
    // ============================================
    if (!otp || otp.length !== 6) {
      showAlert('Please enter a valid 6-digit OTP', 'error');
      return;
    }

    if (!newPassword || newPassword.length < 8) {
      showAlert('Password must be at least 8 characters', 'error');
      return;
    }
    if (newPassword.length > 50) {
      showAlert('Password must be less than 50 characters', 'error');
      return;
    }
    if (!/[A-Z]/.test(newPassword)) {
      showAlert('Password must contain at least one uppercase letter', 'error');
      return;
    }
    if (!/[a-z]/.test(newPassword)) {
      showAlert('Password must contain at least one lowercase letter', 'error');
      return;
    }
    if (!/[0-9]/.test(newPassword)) {
      showAlert('Password must contain at least one number', 'error');
      return;
    }
    if (!/[!@#$%^&*(),.?":{}|<>]/.test(newPassword)) {
      showAlert('Password must contain at least one special character', 'error');
      return;
    }

    if (newPassword !== confirmPassword) {
      showAlert('Passwords do not match', 'error');
      return;
    }

    // ============================================
    // SEND TO BACKEND API
    // ============================================
    const resetBtn = document.getElementById('resetBtn');
    resetBtn.disabled = true;
    resetBtn.innerHTML = '<i class="bi bi-hourglass-split"></i> Resetting...';

    fetch('http://localhost:5000/api/auth/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, otp, newPassword, confirmPassword })
    })
    .then(response => response.json())
    .then(data => {
      resetBtn.disabled = false;
      resetBtn.innerHTML = '<i class="bi bi-check-circle"></i> Reset Password';

      // ============================================
      // ✅ SUCCESS
      // ============================================
      if (data.success) {
        showAlert('✅ Password reset successful! Redirecting to login...', 'success');
        localStorage.removeItem('resetEmail');
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 2000);
        return;
      }

      // ============================================
      // ⏳ RATE LIMIT EXCEEDED
      // ============================================
      if (data.code === 'RATE_LIMIT_EXCEEDED') {
        handleRateLimit(data, resetBtn);
        return;
      }

      // ============================================
      // ❌ OTP EXPIRED
      // ============================================
      if (data.code === 'OTP_EXPIRED') {
        showAlert('❌ OTP has expired. Please request a new one.', 'error');
        return;
      }

      // ============================================
      // ❌ MAX ATTEMPTS REACHED
      // ============================================
      if (data.code === 'MAX_ATTEMPTS_REACHED') {
        showAlert('❌ Maximum attempts reached. Please request a new OTP.', 'error');
        return;
      }

      // ============================================
      // ❌ OTHER ERRORS
      // ============================================
      showAlert('❌ ' + (data.message || 'Password reset failed.'), 'error');
    })
    .catch(error => {
      resetBtn.disabled = false;
      resetBtn.innerHTML = '<i class="bi bi-check-circle"></i> Reset Password';
      showAlert('❌ Network error. Please check if backend is running.', 'error');
      console.error('Reset password error:', error);
    });
  });

  // ============================================
  // RESEND OTP
  // ============================================
  document.getElementById('resendOtpLink').addEventListener('click', function() {
    const email = document.getElementById('email').value;
    const link = this;
    link.style.pointerEvents = 'none';
    link.textContent = 'Sending...';

    fetch('http://localhost:5000/api/auth/forgot-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    })
    .then(response => response.json())
    .then(data => {
      link.style.pointerEvents = 'auto';
      link.textContent = 'Resend OTP';

      if (data.success) {
        showAlert('✅ New OTP sent to your email.', 'success');
        document.getElementById('otp').value = '';
        document.getElementById('otp').focus();
      } else if (data.code === 'RATE_LIMIT_EXCEEDED') {
        showAlert('⏳ ' + (data.message || 'Too many requests. Please wait.'), 'error');
      } else {
        showAlert('❌ ' + (data.message || 'Failed to resend OTP.'), 'error');
      }
    })
    .catch(error => {
      link.style.pointerEvents = 'auto';
      link.textContent = 'Resend OTP';
      showAlert('❌ Network error. Please try again.', 'error');
      console.error('Resend error:', error);
    });
  });

  // ============================================
  // RATE LIMIT HANDLER
  // ============================================
  function handleRateLimit(data, resetBtn) {
    const totalSeconds = data.retryAfter || 60;
    const minutes = data.retryAfterMinutes || Math.ceil(totalSeconds / 60);

    showAlert(
      `⏳ Too many attempts. Please try again in ${minutes} minute${minutes > 1 ? 's' : ''}.`,
      'error'
    );

    resetBtn.disabled = true;
    let remainingSeconds = totalSeconds;

    const updateButton = () => {
      const mins = Math.floor(remainingSeconds / 60);
      const secs = remainingSeconds % 60;
      resetBtn.innerHTML = `<i class="bi bi-hourglass-split"></i> Try again in ${mins}:${secs.toString().padStart(2, '0')}`;
    };

    updateButton();

    const countdown = setInterval(() => {
      remainingSeconds--;

      if (remainingSeconds <= 0) {
        clearInterval(countdown);
        resetBtn.disabled = false;
        resetBtn.innerHTML = '<i class="bi bi-check-circle"></i> Reset Password';
        showAlert('✅ You can try again.', 'info');
        return;
      }

      updateButton();
    }, 1000);
  }

  // ============================================
  // ALERT HELPER
  // ============================================
  function showAlert(message, type = 'info') {
    const container = document.getElementById('alert-container');
    container.innerHTML = '';
    const alert = document.createElement('div');
    alert.className = `alert alert-${type}`;
    alert.textContent = message;
    container.appendChild(alert);

    setTimeout(() => {
      alert.style.opacity = '0';
      alert.style.transition = 'opacity 0.3s';
      setTimeout(() => alert.remove(), 300);
    }, 5000);
  }
</script>

</body>
</html>
