<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SplitWise — Reset Password</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Global Styles -->
  <link rel="stylesheet" href="../css/style.css">

  <!-- Auth Styles -->
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body>

<div class="auth-container">

  <!-- ===== BRAND ===== -->
  <a href="../index.html" class="brand">
    <span class="brand-mark"><i class="bi bi-wallet2"></i></span>
    SplitWise
  </a>

  <!-- ===== AUTH CARD ===== -->
  <div class="auth-card">

    <!-- ===== HEADER ===== -->
    <div class="auth-header">
      <div class="icon-badge"><i class="bi bi-shield-lock" id="headerIcon"></i></div>
      <h1 id="headerTitle">Reset Password</h1>
      <p id="headerSubtitle">Enter the OTP and your new password</p>
    </div>

    <!-- ===== ALERT CONTAINER ===== -->
    <div id="alert-container"></div>

    <!-- ===== FORM ===== -->
    <form id="resetForm" class="auth-form">

      <!-- Current Password (ONLY SHOWN IF LOGGED IN) -->
      <div class="field" id="currentPasswordField" style="display: none;">
        <label for="currentPassword">Current Password</label>
        <div class="input-wrap">
          <i class="bi bi-lock-fill leading"></i>
          <input type="password" id="currentPassword" placeholder="Enter current password" />
        </div>
      </div>
      
      <!-- Email (readonly) -->
      <div class="field" id="emailField">
        <label for="email">Email Address</label>
        <div class="input-wrap">
          <i class="bi bi-envelope leading"></i>
          <input type="email" id="email" placeholder="Your email" readonly />
        </div>
      </div>

      <!-- OTP (Visible in both modes, but hidden initially in Account Mode) -->
      <div class="field" id="otpField" style="display: none;">
        <label for="otp">Enter OTP</label>
        <div class="input-wrap">
          <i class="bi bi-key leading"></i>
          <input type="text" id="otp" placeholder="6-digit OTP" maxlength="6" />
        </div>
      </div>

      <!-- New Password -->
      <div class="field">
        <label for="newPassword">New Password</label>
        <div class="input-wrap">
          <i class="bi bi-lock leading"></i>
          <input type="password" id="newPassword" placeholder="Create new password" required />
          <button type="button" class="toggle-eye" data-target="newPassword" aria-label="Show password">
            <i class="bi bi-eye"></i>
          </button>
        </div>
      </div>

      <!-- Confirm Password -->
      <div class="field">
        <label for="confirmPassword">Confirm Password</label>
        <div class="input-wrap">
          <i class="bi bi-lock leading"></i>
          <input type="password" id="confirmPassword" placeholder="Confirm new password" required />
          <button type="button" class="toggle-eye" data-target="confirmPassword" aria-label="Show password">
            <i class="bi bi-eye"></i>
          </button>
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn btn-primary btn-block" id="resetBtn" style="margin-top: 8px;">
        <i class="bi bi-check-circle"></i> <span id="btnText">Reset Password</span>
      </button>

    </form>

    <!-- ===== RESEND LINK (HIDDEN IF LOGGED IN) ===== -->
    <div class="resend-link" id="resendContainer" style="text-align: center; font-size: 13px; color: var(--text-mid); margin-top: 16px;">
      Didn't receive OTP? <a id="resendOtpLink" style="color: var(--magenta); font-weight: 600; cursor: pointer; text-decoration: none;">Resend OTP</a>
    </div>

    <!-- ===== FOOTER ===== -->
    <div class="auth-footer">
      <a href="login.html" id="footerLink">Back to Login</a>
    </div>

  </div>
</div>

<!-- ========================================
   SCRIPTS
======================================== -->
<script>
  // ============================================
  // DETECT MODE (ACCOUNT SETTINGS vs FORGOT PASS)
  // ============================================
  const token = localStorage.getItem('accessToken');
  const urlParams = new URLSearchParams(window.location.search);
  const isAccountMode = urlParams.get('from') === 'account';
  
  let resetEmail = null;

  if (isAccountMode && token) {
    // ✅ ACCOUNT MODE (Logged In)
    document.getElementById('headerTitle').textContent = 'Update Password';
    document.getElementById('headerSubtitle').textContent = 'Verify your identity to change password';
    document.getElementById('btnText').textContent = 'Verify & Send OTP'; // Initial button text
    document.getElementById('footerLink').textContent = '← Back to Account';
    document.getElementById('footerLink').href = 'account.html';

    document.getElementById('currentPasswordField').style.display = 'block';
    document.getElementById('emailField').style.display = 'none';
    document.getElementById('resendContainer').style.display = 'none';
    
    // OTP is hidden initially
    document.getElementById('otpField').style.display = 'none';
    
    const user = JSON.parse(localStorage.getItem('user') || '{}');
    resetEmail = user.email;

  } else {
    // ❌ FORGOT PASSWORD MODE (Not Logged In)
    resetEmail = localStorage.getItem('resetEmail');
    
    // If they somehow land here without an email in localStorage, kick them back
    if (!resetEmail) {
      showAlert('❌ No reset session found. Please enter your email first.', 'error');
      setTimeout(() => { window.location.href = 'forgot-password.html'; }, 2000);
    } else {
      document.getElementById('email').value = resetEmail;
    }
    document.getElementById('otp').focus();
  }

  // ============================================
  // PASSWORD TOGGLE
  // ============================================
  document.querySelectorAll('.toggle-eye').forEach(btn => {
    btn.addEventListener('click', function() {
      const input = document.getElementById(this.dataset.target);
      const icon = this.querySelector('i');
      if (input) {
        if (input.type === 'password') {
          input.type = 'text';
          icon.className = 'bi bi-eye';
        } else {
          input.type = 'password';
          icon.className = 'bi bi-eye-slash';
        }
      }
    });
  });

  // ============================================
  // FORM SUBMIT
  // ============================================
  document.getElementById('resetForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const resetBtn = document.getElementById('resetBtn');

    // Frontend Validation
    if (newPassword !== confirmPassword) {
      showAlert('Passwords do not match', 'error');
      return;
    }
    if (newPassword.length < 8) {
      showAlert('Password must be at least 8 characters', 'error');
      return;
    }
    if (isAccountMode && token) {
      const currentPassword = document.getElementById('currentPassword').value;
      if (currentPassword === newPassword) {
        showAlert('New password cannot be the same as your current password.', 'error');
        return;
      }
    }

    // ============================================
    // ACCOUNT MODE (Logged In)
    // ============================================
    if (isAccountMode && token) {
      const currentPassword = document.getElementById('currentPassword').value;
      const otp = document.getElementById('otp').value;
      const otpFieldVisible = document.getElementById('otpField').style.display !== 'none';

      if (!currentPassword) {
        showAlert('Please enter your current password', 'error');
        return;
      }

      // PHASE 1: User has not sent OTP yet
      if (!otpFieldVisible) {
        resetBtn.disabled = true;
        resetBtn.innerHTML = '<i class="bi bi-hourglass-split"></i> Sending OTP...';

        fetch('https://api.digitalwallet.dpdns.org/api/auth/change-password/request-otp', {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}` }
        })
        .then(res => res.json())
        .then(data => {
          resetBtn.disabled = false;
          resetBtn.innerHTML = '<i class="bi bi-check-circle"></i> <span>Confirm Password Change</span>';
          
          if (data.success) {
            showAlert('✅ OTP sent to your email. Please check and enter it below.', 'success');
            document.getElementById('otpField').style.display = 'block';
          } else {
            showAlert('❌ ' + data.message, 'error');
          }
        });
        return;
      }

      // PHASE 2: User has entered OTP, now submit
      if (!otp || otp.length !== 6) {
        showAlert('Please enter the 6-digit OTP', 'error');
        return;
      }

      resetBtn.disabled = true;
      resetBtn.innerHTML = '<i class="bi bi-hourglass-split"></i> Updating...';

      fetch('https://api.digitalwallet.dpdns.org/api/auth/change-password/confirm', {
        method: 'POST',
        headers: { 
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        },
        body: JSON.stringify({ currentPassword, newPassword, otp })
      })
      .then(res => res.json())
      .then(data => {
        resetBtn.disabled = false;
        resetBtn.innerHTML = '<i class="bi bi-check-circle"></i> <span>Confirm Password Change</span>';
        
        if (data.success) {
          showAlert('✅ Password updated successfully!', 'success');
          setTimeout(() => { window.location.href = 'account.html'; }, 2000);
        } else {
          showAlert('❌ ' + (data.message || 'Failed to update password.'), 'error');
        }
      });
      return;
    }

    // ============================================
    // FORGOT PASSWORD MODE (Not Logged In)
    // ============================================
    const email = document.getElementById('email').value;
    const otp = document.getElementById('otp').value.trim();

    // Check OTP is entered
    if (!otp || otp.length !== 6) {
      showAlert('Please enter a valid 6-digit OTP', 'error');
      return;
    }

    resetBtn.disabled = true;
    resetBtn.innerHTML = '<i class="bi bi-hourglass-split"></i> Resetting...';

    fetch('https://api.digitalwallet.dpdns.org/api/auth/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, otp, newPassword, confirmPassword })
    })
    .then(response => response.json())
    .then(data => {
      resetBtn.disabled = false;
      resetBtn.innerHTML = '<i class="bi bi-check-circle"></i> <span>Reset Password</span>';

      if (data.success) {
        showAlert('✅ Password reset successful! Redirecting to login...', 'success');
        localStorage.removeItem('resetEmail');
        setTimeout(() => { window.location.href = 'login.html'; }, 2000);
        return;
      }
      
      if (data.code === 'RATE_LIMIT_EXCEEDED') { handleRateLimit(data, resetBtn); return; }
      if (data.code === 'OTP_EXPIRED') { showAlert('❌ OTP has expired. Please request a new one.', 'error'); return; }
      
      showAlert('❌ ' + (data.message || 'Password reset failed.'), 'error');
    })
    .catch(error => {
      resetBtn.disabled = false;
      resetBtn.innerHTML = '<i class="bi bi-check-circle"></i> <span>Reset Password</span>';
      showAlert('❌ Network error.', 'error');
    });
  });

  // ============================================
  // RESEND OTP (Only visible in Forgot Password mode)
  // ============================================
  document.getElementById('resendOtpLink').addEventListener('click', function() {
    const email = document.getElementById('email').value;
    const link = this;
    link.style.pointerEvents = 'none';
    link.textContent = 'Sending...';

    fetch('https://api.digitalwallet.dpdns.org/api/auth/forgot-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    })
    .then(response => response.json())
    .then(data => {
      link.style.pointerEvents = 'auto';
      link.textContent = 'Resend OTP';

      if (data.success) {
        showAlert('✅ New OTP sent to your email.', 'success');
        document.getElementById('otp').value = '';
        document.getElementById('otp').focus();
      } else {
        showAlert('❌ ' + (data.message || 'Failed to resend OTP.'), 'error');
      }
    })
    .catch(error => {
      link.style.pointerEvents = 'auto';
      link.textContent = 'Resend OTP';
      showAlert('❌ Network error. Please try again.', 'error');
    });
  });

  // ============================================
  // HELPERS
  // ============================================
  function handleRateLimit(data, resetBtn) {
    const totalSeconds = data.retryAfter || 60;
    const minutes = data.retryAfterMinutes || Math.ceil(totalSeconds / 60);
    showAlert(`⏳ Too many attempts. Please try again in ${minutes} minute${minutes > 1 ? 's' : ''}.`, 'error');
    resetBtn.disabled = true;
    let remainingSeconds = totalSeconds;
    const updateButton = () => {
      const mins = Math.floor(remainingSeconds / 60);
      const secs = remainingSeconds % 60;
      resetBtn.innerHTML = `<i class="bi bi-hourglass-split"></i> Try again in ${mins}:${secs.toString().padStart(2, '0')}`;
    };
    updateButton();
    const countdown = setInterval(() => {
      remainingSeconds--;
      if (remainingSeconds <= 0) {
        clearInterval(countdown);
        resetBtn.disabled = false;
        resetBtn.innerHTML = '<i class="bi bi-check-circle"></i> <span>Reset Password</span>';
        showAlert('✅ You can try again.', 'info');
        return;
      }
      updateButton();
    }, 1000);
  }

  function showAlert(message, type = 'info') {
    const container = document.getElementById('alert-container');
    container.innerHTML = '';
    const alert = document.createElement('div');
    alert.className = `alert alert-${type}`;
    alert.textContent = message;
    container.appendChild(alert);
    setTimeout(() => {
      alert.style.opacity = '0';
      alert.style.transition = 'opacity 0.3s';
      setTimeout(() => alert.remove(), 300);
    }, 5000);
  }
</script>

</body>
</html>
