<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SplitWise — Create Account</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <style>
    /* ========================================
       CSS VARIABLES
    ======================================== */
    :root {
      --bg-0: #0e0716;
      --bg-1: #170a24;
      --stroke: rgba(168, 120, 255, 0.16);
      --stroke-strong: rgba(168, 120, 255, 0.28);
      --violet-1: #7c3aed;
      --violet-2: #c026d3;
      --magenta: #e63cc2;
      --text-hi: #f3eefc;
      --text-mid: #b7a9cf;
      --text-low: #8779a3;
      --gold: #f0b84f;
      --success: #5eea9a;
      --danger: #f77b7b;
      --field-bg: #150a20;
    }

    /* ========================================
       RESET & BASE
    ======================================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(ellipse 900px 500px at 12% 8%, rgba(124, 58, 237, 0.25), transparent 60%),
        radial-gradient(ellipse 700px 600px at 85% 90%, rgba(230, 60, 194, 0.14), transparent 55%),
        linear-gradient(160deg, var(--bg-0), var(--bg-1) 60%, #0c0512);
      font-family: 'Inter', sans-serif;
      color: var(--text-hi);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* ========================================
       AUTH CONTAINER
    ======================================== */
    .auth-container {
      width: 100%;
      max-width: 440px;
    }

    /* ========================================
       BRAND
    ======================================== */
    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-family: 'Sora', sans-serif;
      font-weight: 700;
      letter-spacing: 0.06em;
      font-size: 18px;
      color: var(--text-hi);
      text-decoration: none;
      margin-bottom: 28px;
    }

    .brand-mark {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--violet-1), var(--magenta));
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 18px -4px rgba(192, 38, 211, 0.6);
      font-size: 20px;
      color: #fff;
    }

    /* ========================================
       AUTH CARD
    ======================================== */
    .auth-card {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.035), rgba(255, 255, 255, 0.01));
      border: 1px solid var(--stroke-strong);
      border-radius: 24px;
      padding: 36px 32px 32px;
      box-shadow: 0 30px 80px -20px rgba(70, 10, 120, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }

    /* ========================================
       AUTH HEADER
    ======================================== */
    .auth-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .auth-header .icon-badge {
      width: 56px;
      height: 56px;
      margin: 0 auto 14px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--violet-1), var(--magenta));
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 24px -6px rgba(192, 38, 211, 0.55);
      font-size: 24px;
      color: #fff;
    }

    .auth-header h1 {
      font-family: 'Sora', sans-serif;
      font-size: 24px;
      margin: 0 0 6px;
      font-weight: 700;
    }

    .auth-header p {
      font-size: 13px;
      color: var(--text-low);
      margin: 0;
    }

    /* ========================================
       FORM
    ======================================== */
    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .field {
      margin-bottom: 0;
    }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-mid);
      margin-bottom: 5px;
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrap .leading {
      position: absolute;
      left: 13px;
      width: 16px;
      height: 16px;
      color: var(--text-low);
      pointer-events: none;
      font-size: 16px;
    }

    .input-wrap input {
      width: 100%;
      padding: 12px 14px 12px 40px;
      background: var(--field-bg);
      border: 1px solid var(--stroke);
      border-radius: 11px;
      color: var(--text-hi);
      font-size: 13.5px;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .input-wrap input::placeholder {
      color: var(--text-low);
      font-size: 13px;
    }

    .input-wrap input:focus {
      border-color: var(--magenta);
      box-shadow: 0 0 0 3px rgba(230, 60, 194, 0.15);
    }

    .input-wrap .toggle-eye {
      position: absolute;
      right: 13px;
      width: 16px;
      height: 16px;
      color: var(--text-low);
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      transition: color 0.15s;
    }

    .input-wrap .toggle-eye:hover {
      color: var(--text-mid);
    }

    /* ========================================
       PASSWORD STRENGTH
    ======================================== */
    .strength {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }

    .strength-bars {
      display: flex;
      gap: 4px;
      flex: 1;
    }

    .strength-bars i {
      height: 4px;
      flex: 1;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.08);
      transition: background 0.3s;
    }

    .strength-bars i.on {
      background: linear-gradient(90deg, var(--violet-1), var(--magenta));
    }

    .strength-label {
      font-size: 11px;
      color: var(--text-low);
      white-space: nowrap;
      font-weight: 500;
    }

    /* ========================================
       BUTTONS
    ======================================== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 24px;
      border: none;
      border-radius: 12px;
      font-family: 'Sora', sans-serif;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.15s ease;
      text-decoration: none;
      width: 100%;
    }

    .btn-primary {
      background: linear-gradient(90deg, var(--violet-1), var(--magenta));
      color: #fff;
      box-shadow: 0 14px 30px -10px rgba(192, 38, 211, 0.55);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 34px -8px rgba(192, 38, 211, 0.65);
    }

    /* ========================================
       DIVIDER
    ======================================== */
    .auth-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 22px 0 18px;
      font-size: 11.5px;
      color: var(--text-low);
    }

    .auth-divider::before,
    .auth-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--stroke);
    }

    /* ========================================
       SOCIAL ROW - IMPROVED GOOGLE BUTTON
    ======================================== */
    .social-row {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .social-btn {
      flex: 1;
      max-width: 280px;
      height: 48px;
      border-radius: 11px;
      border: 1px solid var(--stroke);
      background: rgba(255, 255, 255, 0.03);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-mid);
      padding: 0 20px;
    }

    .social-btn:hover {
      border-color: rgba(168, 120, 255, 0.5);
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-hi);
      transform: translateY(-1px);
      box-shadow: 0 4px 20px -8px rgba(124, 58, 237, 0.3);
    }

    .social-btn:active {
      transform: translateY(0);
    }

    .social-btn svg {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
    }

    .social-btn span {
      color: var(--text-mid);
      font-weight: 500;
      font-size: 13px;
      letter-spacing: 0.01em;
    }

    .social-btn:hover span {
      color: var(--text-hi);
    }

    /* Google button specific - makes it pop more */
    .social-btn.google-btn {
      background: rgba(255, 255, 255, 0.04);
      border-color: var(--stroke-strong);
    }

    .social-btn.google-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(168, 120, 255, 0.6);
      box-shadow: 0 4px 24px -8px rgba(124, 58, 237, 0.4);
    }

    /* ========================================
       AUTH FOOTER
    ======================================== */
    .auth-footer {
      text-align: center;
      margin-top: 22px;
      font-size: 13px;
      color: var(--text-mid);
      padding-top: 4px;
    }

    .auth-footer a {
      color: var(--magenta);
      text-decoration: none;
      font-weight: 600;
    }

    .auth-footer a:hover {
      text-decoration: underline;
    }

    /* ========================================
       ALERT
    ======================================== */
    #alert-container {
      margin-bottom: 16px;
    }

    .alert {
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 8px;
      animation: slideDown 0.3s ease;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .alert-error {
      background: rgba(247, 123, 123, 0.15);
      border: 1px solid rgba(247, 123, 123, 0.3);
      color: var(--danger);
    }

    .alert-success {
      background: rgba(94, 234, 154, 0.15);
      border: 1px solid rgba(94, 234, 154, 0.3);
      color: var(--success);
    }

    /* ========================================
       RESPONSIVE
    ======================================== */
    @media (max-width: 480px) {
      .auth-card {
        padding: 24px 18px 20px;
      }

      .social-row {
        flex-direction: column;
        align-items: center;
      }

      .social-btn {
        max-width: 100%;
        width: 100%;
      }

      .auth-header h1 {
        font-size: 20px;
      }

      .brand {
        font-size: 16px;
      }
    }

    /* ========================================
       ADD SPACING BETWEEN ELEMENTS
    ======================================== */
    .spacer-4 { margin-top: 4px; }
    .spacer-8 { margin-top: 8px; }
    .spacer-12 { margin-top: 12px; }
    .spacer-16 { margin-top: 16px; }
    .spacer-20 { margin-top: 20px; }
  </style>
</head>
<body>

<div class="auth-container">

  <!-- ===== BRAND ===== -->
  <a href="../index.html" class="brand">
    <span class="brand-mark"><i class="bi bi-wallet2"></i></span>
    SplitWise
  </a>

  <!-- ===== AUTH CARD ===== -->
  <div class="auth-card">

    <!-- ===== HEADER ===== -->
    <div class="auth-header">
      <div class="icon-badge"><i class="bi bi-person-plus"></i></div>
      <h1>Create Account</h1>
      <p>Start splitting expenses with your group</p>
    </div>

    <!-- ===== ALERT CONTAINER ===== -->
    <div id="alert-container"></div>

    <!-- ===== FORM ===== -->
    <form id="registerForm" class="auth-form">

      <!-- Full Name -->
      <div class="field">
        <label for="fullName">Full Name</label>
        <div class="input-wrap">
          <i class="bi bi-person leading"></i>
          <input type="text" id="fullName" placeholder="Enter your full name" autocomplete="name" required />
        </div>
      </div>

      <!-- Email -->
      <div class="field">
        <label for="email">Email Address</label>
        <div class="input-wrap">
          <i class="bi bi-envelope leading"></i>
          <input type="email" id="email" placeholder="Enter your email" autocomplete="email" required />
        </div>
      </div>

      <!-- Mobile -->
      <div class="field">
        <label for="mobile">Mobile Number <span style="color: var(--text-low); font-weight: 400;">(optional)</span></label>
        <div class="input-wrap">
          <i class="bi bi-phone leading"></i>
          <input type="tel" id="mobile" placeholder="Enter your mobile number" autocomplete="tel" />
        </div>
      </div>

      <!-- Password -->
      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <i class="bi bi-lock leading"></i>
          <input type="password" id="password" placeholder="Create a strong password" autocomplete="new-password" required />
          <button type="button" class="toggle-eye" data-target="password" aria-label="Show password">
            <i class="bi bi-eye"></i>
          </button>
        </div>
        <div class="strength">
          <div class="strength-bars">
            <i class="bar"></i><i class="bar"></i><i class="bar"></i><i class="bar"></i>
          </div>
          <span class="strength-label">Weak</span>
        </div>
      </div>

      <!-- Confirm Password -->
      <div class="field">
        <label for="confirmPassword">Confirm Password</label>
        <div class="input-wrap">
          <i class="bi bi-lock leading"></i>
          <input type="password" id="confirmPassword" placeholder="Confirm your password" autocomplete="new-password" required />
          <button type="button" class="toggle-eye" data-target="confirmPassword" aria-label="Show password">
            <i class="bi bi-eye"></i>
          </button>
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn btn-primary spacer-8">
        <i class="bi bi-person-plus"></i> Create Account
      </button>

    </form>

    <!-- ===== DIVIDER ===== -->
    <div class="auth-divider">or continue with</div>

    <!-- ===== SOCIAL LOGIN - GOOGLE (IMPROVED) ===== -->
    <div class="social-row">
      <button class="social-btn google-btn" id="googleLoginBtn" aria-label="Continue with Google">
        <svg viewBox="0 0 48 48" width="24" height="24">
          <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/>
          <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 16.3 4 9.6 8.3 6.3 14.7z"/>
          <path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.9 14.3-5.1l-6.6-5.6C29.6 34.8 26.9 36 24 36c-5.2 0-9.6-3.1-11.3-7.9l-6.6 5.1C9.5 39.6 16.2 44 24 44z"/>
          <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.7l6.6 5.6C40.9 36.5 44 30.9 44 24c0-1.3-.1-2.7-.4-3.5z"/>
        </svg>
        <span>Continue with Google</span>
      </button>
    </div>

    <!-- ===== FOOTER ===== -->
    <div class="auth-footer">
      Already have an account? <a href="login.html">Log in</a>
    </div>

  </div>
</div>

<!-- ========================================
   SCRIPTS
======================================== -->
<script>
  // ========================================
  // GOOGLE LOGIN
  // ========================================
  document.getElementById('googleLoginBtn').addEventListener('click', function() {
    // Store redirect info
    localStorage.setItem('auth_redirect', window.location.pathname);
    
    // In production, redirect to backend
    // window.location.href = 'http://localhost:5000/auth/google';
    
    // For demo: Show success message
    showAlert('🚀 Google login coming soon! (Backend integration needed)', 'info');
  });

  // ========================================
  // PASSWORD TOGGLE
  // ========================================
  // ========================================
// PASSWORD TOGGLE - FIXED
// ========================================
document.querySelectorAll('.toggle-eye').forEach(btn => {
    btn.addEventListener('click', function() {
        const input = document.getElementById(this.dataset.target);
        const icon = this.querySelector('i');
        if (input) {
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'bi bi-eye';        // ✅ Show eye when visible
            } else {
                input.type = 'password';
                icon.className = 'bi bi-eye-slash';   // ✅ Show eye-slash when hidden
            }
        }
    });
});
  // ========================================
  // PASSWORD STRENGTH
  // ========================================
  const pwInput = document.getElementById('password');
  const bars = document.querySelectorAll('.strength-bars .bar');
  const strengthLabel = document.querySelector('.strength-label');

  function scorePassword(pw) {
    let score = 0;
    if (pw.length >= 6) score++;
    if (pw.length >= 10) score++;
    if (/[A-Z]/.test(pw) && /[a-z]/.test(pw)) score++;
    if (/[0-9]/.test(pw) && /[^A-Za-z0-9]/.test(pw)) score++;
    return score;
  }

  pwInput.addEventListener('input', function() {
    const score = this.value.length === 0 ? 0 : Math.max(1, scorePassword(this.value));
    bars.forEach((bar, i) => bar.classList.toggle('on', i < score));
    const labels = ['Weak', 'Weak', 'Fair', 'Good', 'Strong'];
    strengthLabel.textContent = labels[score] || 'Weak';
  });

  // ========================================
  // PASSWORD MATCH
  // ========================================
  const confirmInput = document.getElementById('confirmPassword');

  function checkMatch() {
    if (confirmInput.value.length > 0) {
      if (pwInput.value !== confirmInput.value) {
        confirmInput.style.borderColor = 'var(--danger)';
      } else {
        confirmInput.style.borderColor = 'var(--success)';
      }
    } else {
      confirmInput.style.borderColor = '';
    }
  }

  pwInput.addEventListener('input', checkMatch);
  confirmInput.addEventListener('input', checkMatch);
// ========================================
// FORM SUBMIT - WITH COMPLETE VALIDATION
// ========================================
document.getElementById('registerForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const fullName = document.getElementById('fullName').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    // ============================================
    // 1. NAME VALIDATION
    // ============================================
    if (!fullName || fullName.length < 2) {
        showAlert('Please enter your full name (minimum 2 characters)', 'error');
        return;
    }
    if (fullName.length > 50) {
        showAlert('Name must be less than 50 characters', 'error');
        return;
    }
    if (!/^[a-zA-Z\s]+$/.test(fullName)) {
        showAlert('Name can only contain letters and spaces', 'error');
        return;
    }

    // ============================================
    // 2. EMAIL VALIDATION - WITH LENGTH CHECK
    // ============================================
    if (!email) {
        showAlert('Please enter your email address', 'error');
        return;
    }
    if (email.length > 100) {
        showAlert('Email must be less than 100 characters', 'error');
        return;
    }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        showAlert('Please enter a valid email address', 'error');
        return;
    }

    // ============================================
    // 3. MOBILE VALIDATION - WITH LENGTH CHECK
    // ============================================
    const mobile = document.getElementById('mobile').value.trim();
    if (!mobile) {
        showAlert('Mobile number is required', 'error');
        return;
    }
    if (mobile.length !== 10) {
        showAlert('Mobile number must be exactly 10 digits', 'error');
        return;
    }
    if (!/^[6-9][0-9]{9}$/.test(mobile)) {
        showAlert('Please enter a valid Indian mobile number (starting with 6,7,8, or 9)', 'error');
        return;
    }

    // ============================================
    // 4. PASSWORD VALIDATION
    // ============================================
    if (password.length < 6) {
        showAlert('Password must be at least 6 characters', 'error');
        return;
    }

    // ============================================
    // 5. CONFIRM PASSWORD
    // ============================================
    if (password !== confirmPassword) {
        showAlert('Passwords do not match', 'error');
        return;
    }

    // ============================================
    // 6. 🔥 SEND TO BACKEND API
    // ============================================
    const registerBtn = this.querySelector('button[type="submit"]');
    registerBtn.disabled = true;
    registerBtn.innerHTML = '<i class="bi bi-hourglass-split"></i> Creating...';

    fetch('http://localhost:5000/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            name: fullName,
            email: email,
            mobile: mobile,
            password: password,
            confirmPassword: confirmPassword
        })
    })
    .then(response => response.json())
    .then(data => {
        registerBtn.disabled = false;
        registerBtn.innerHTML = '<i class="bi bi-person-plus"></i> Create Account';

        if (data.success) {
            // ✅ Store email for verification page
            localStorage.setItem('pendingEmail', email);
            
            showAlert('✅ ' + (data.message || 'Account created! Please check your email for OTP.'), 'success');
            setTimeout(() => {
                window.location.href = 'verify.html';
            }, 1500);
        } else {
            // Handle specific errors
            if (data.code === 'EMAIL_EXISTS') {
                showAlert('❌ Email already exists. Please use another email.', 'error');
            } else if (data.code === 'MOBILE_EXISTS') {
                showAlert('❌ Mobile number already registered.', 'error');
            } else {
                showAlert('❌ ' + (data.message || 'Registration failed.'), 'error');
            }
        }
    })
    .catch(error => {
        registerBtn.disabled = false;
        registerBtn.innerHTML = '<i class="bi bi-person-plus"></i> Create Account';
        showAlert('❌ Network error. Please check if backend is running.', 'error');
        console.error('Registration error:', error);
    });
});

  // ========================================
  // ALERT HELPER
  // ========================================
  function showAlert(message, type = 'info') {
    const container = document.getElementById('alert-container');
    container.innerHTML = '';
    const alert = document.createElement('div');
    alert.className = `alert alert-${type}`;
    alert.textContent = message;
    container.appendChild(alert);

    setTimeout(() => {
      alert.style.opacity = '0';
      alert.style.transition = 'opacity 0.3s';
      setTimeout(() => alert.remove(), 300);
    }, 5000);
  }

  // ========================================
// REAL-TIME VALIDATION (As User Types)
// ========================================

// Name - real-time validation
document.getElementById('fullName').addEventListener('input', function() {
    const val = this.value.trim();
    if (val.length > 0 && val.length < 2) {
        this.style.borderColor = 'var(--danger)';
    } else if (val.length > 50) {
        this.style.borderColor = 'var(--danger)';
    } else if (!/^[a-zA-Z\s]*$/.test(val)) {
        this.style.borderColor = 'var(--danger)';
    } else {
        this.style.borderColor = 'var(--success)';
    }
});

// Email - real-time validation
document.getElementById('email').addEventListener('input', function() {
    const val = this.value.trim();
    if (val.length > 100) {
        this.style.borderColor = 'var(--danger)';
    } else if (val.length > 0 && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val)) {
        this.style.borderColor = 'var(--danger)';
    } else {
        this.style.borderColor = 'var(--success)';
    }
});

// Mobile - real-time validation
document.getElementById('mobile').addEventListener('input', function() {
    const val = this.value.trim();
    if (val.length > 0 && val.length !== 10) {
        this.style.borderColor = 'var(--danger)';
    } else if (val.length === 10 && !/^[6-9][0-9]{9}$/.test(val)) {
        this.style.borderColor = 'var(--danger)';
    } else if (val.length === 10) {
        this.style.borderColor = 'var(--success)';
    } else {
        this.style.borderColor = '';
    }
});

// Password - real-time validation (already has strength)
document.getElementById('password').addEventListener('input', function() {
    const val = this.value;
    if (val.length > 0 && val.length < 6) {
        this.style.borderColor = 'var(--danger)';
    } else if (val.length >= 6) {
        this.style.borderColor = 'var(--success)';
    } else {
        this.style.borderColor = '';
    }
});

// Confirm Password - real-time validation
document.getElementById('confirmPassword').addEventListener('input', function() {
    const pw = document.getElementById('password').value;
    const val = this.value;
    if (val.length > 0 && val !== pw) {
        this.style.borderColor = 'var(--danger)';
    } else if (val.length > 0 && val === pw) {
        this.style.borderColor = 'var(--success)';
    } else {
        this.style.borderColor = '';
    }
});
</script>
