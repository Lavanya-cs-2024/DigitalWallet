<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SplitWise — Verify Email</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body>

<div class="auth-container">

  <!-- ===== BRAND ===== -->
  <a href="../index.html" class="brand">
    <span class="brand-mark"><i class="bi bi-wallet2"></i></span>
    SplitWise
  </a>

  <!-- ===== AUTH CARD ===== -->
  <div class="auth-card">

    <!-- ===== HEADER ===== -->
    <div class="auth-header">
      <div class="icon-badge"><i class="bi bi-envelope-check"></i></div>
      <h1>Verify Your Email</h1>
      <p>Enter the 6-digit OTP sent to your email</p>
    </div>

    <!-- ===== ALERT CONTAINER ===== -->
    <div id="alert-container"></div>

    <!-- ===== FORM ===== -->
    <form id="verifyForm" class="auth-form">

      <!-- Email (readonly) -->
      <div class="field">
        <label for="email">Email Address</label>
        <div class="input-wrap">
          <i class="bi bi-envelope leading"></i>
          <input type="email" id="email" placeholder="Your email" readonly />
        </div>
      </div>

      <!-- OTP -->
      <div class="field">
        <label for="otp">Enter OTP</label>
        <div class="input-wrap">
          <i class="bi bi-key leading"></i>
          <input type="text" id="otp" placeholder="6-digit OTP" maxlength="6" required autofocus />
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn btn-primary btn-block" id="verifyBtn" style="margin-top: 8px;">
        <i class="bi bi-check-circle"></i> Verify Email
      </button>

    </form>

    <!-- ===== RESEND LINK ===== -->
    <div class="resend-link" style="text-align: center; font-size: 13px; color: var(--text-mid); margin-top: 16px;">
      Didn't receive OTP? <a id="resendOtpLink" style="color: var(--magenta); font-weight: 600; cursor: pointer; text-decoration: none;">Resend OTP</a>
    </div>

    <!-- ===== FOOTER ===== -->
    <div class="auth-footer">
      <a href="login.html">Back to Login</a>
    </div>

  </div>
</div>

<script>
  // ============================================
  // LOAD EMAIL FROM LOCALSTORAGE
  // ============================================
  const pendingEmail = localStorage.getItem('pendingEmail');

  if (pendingEmail) {
    document.getElementById('email').value = pendingEmail;
  } else {
    showAlert('❌ No pending registration found. Please register first.', 'error');
    setTimeout(() => {
      window.location.href = 'register.html';
    }, 2000);
  }

  // ============================================
  // AUTO-FOCUS OTP FIELD
  // ============================================
  document.getElementById('otp').focus();

  // ============================================
  // AUTO-SUBMIT ON 6 DIGITS
  // ============================================
  document.getElementById('otp').addEventListener('input', function() {
    if (this.value.length === 6) {
      document.getElementById('verifyForm').dispatchEvent(new Event('submit'));
    }
  });

  // ============================================
  // FORM SUBMIT - VERIFY OTP
  // ============================================
  document.getElementById('verifyForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const email = document.getElementById('email').value;
    const otp = document.getElementById('otp').value.trim();

    if (!otp || otp.length !== 6) {
      showAlert('Please enter a valid 6-digit OTP', 'error');
      return;
    }

    const verifyBtn = document.getElementById('verifyBtn');
    verifyBtn.disabled = true;
    verifyBtn.innerHTML = '<i class="bi bi-hourglass-split"></i> Verifying...';

    fetch('http://localhost:5000/api/auth/verify-email', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, otp })
    })
    .then(response => response.json())
    .then(data => {
      verifyBtn.disabled = false;
      verifyBtn.innerHTML = '<i class="bi bi-check-circle"></i> Verify Email';

      // ============================================
      // ✅ SUCCESS
      // ============================================
      if (data.success) {
        showAlert('✅ ' + (data.message || 'Email verified successfully!'), 'success');
        localStorage.removeItem('pendingEmail');
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 2000);
        return;
      }

      // ============================================
      // ✅ Handle RATE_LIMIT_EXCEEDED
      // ============================================
      if (data.code === 'RATE_LIMIT_EXCEEDED') {
        handleRateLimit(data, verifyBtn);
        return;
      }

      // ============================================
      // ✅ Handle OTP_EXPIRED
      // ============================================
      if (data.code === 'OTP_EXPIRED') {
        showAlert('❌ OTP has expired. Please request a new one.', 'error');
        return;
      }

      // ============================================
      // ✅ Handle MAX_ATTEMPTS_REACHED
      // ============================================
      if (data.code === 'MAX_ATTEMPTS_REACHED') {
        showAlert('❌ Maximum attempts reached. Please request a new OTP.', 'error');
        return;
      }

      // ============================================
      // ✅ Handle Invalid OTP
      // ============================================
      if (data.message && data.message.includes('Invalid OTP')) {
        showAlert('❌ ' + data.message, 'error');
        return;
      }

      // ============================================
      // ✅ Handle other errors
      // ============================================
      showAlert('❌ ' + (data.message || 'Verification failed.'), 'error');
    })
    .catch(error => {
      verifyBtn.disabled = false;
      verifyBtn.innerHTML = '<i class="bi bi-check-circle"></i> Verify Email';
      showAlert('❌ Network error. Please check if backend is running.', 'error');
      console.error('Verification error:', error);
    });
  });

  // ============================================
  // RATE LIMIT HANDLER
  // ============================================
  function handleRateLimit(data, verifyBtn) {
    const totalSeconds = data.retryAfter || 60;
    const minutes = data.retryAfterMinutes || Math.ceil(totalSeconds / 60);

    showAlert(
      `⏳ Too many attempts. Please try again in ${minutes} minute${minutes > 1 ? 's' : ''}.`,
      'error'
    );

    verifyBtn.disabled = true;
    let remainingSeconds = totalSeconds;

    const updateButton = () => {
      const mins = Math.floor(remainingSeconds / 60);
      const secs = remainingSeconds % 60;
      verifyBtn.innerHTML = `<i class="bi bi-hourglass-split"></i> Try again in ${mins}:${secs.toString().padStart(2, '0')}`;
    };

    updateButton();

    const countdown = setInterval(() => {
      remainingSeconds--;

      if (remainingSeconds <= 0) {
        clearInterval(countdown);
        verifyBtn.disabled = false;
        verifyBtn.innerHTML = '<i class="bi bi-check-circle"></i> Verify Email';
        showAlert('✅ You can try verifying again.', 'info');
        return;
      }

      updateButton();
    }, 1000);
  }

  // ============================================
  // RESEND OTP
  // ============================================
  document.getElementById('resendOtpLink').addEventListener('click', function() {
    const email = document.getElementById('email').value;
    const link = this;
    link.style.pointerEvents = 'none';
    link.textContent = 'Sending...';

    fetch('http://localhost:5000/api/auth/resend-otp', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    })
    .then(response => response.json())
    .then(data => {
      link.style.pointerEvents = 'auto';
      link.textContent = 'Resend OTP';

      if (data.success) {
        showAlert('✅ New OTP sent to your email. Valid for 2 minutes.', 'success');
        document.getElementById('otp').value = '';
        document.getElementById('otp').focus();
      } else {
        if (data.code === 'COOLDOWN_ACTIVE') {
          showAlert('⏳ ' + (data.message || 'Please wait before requesting again.'), 'info');
        } else if (data.code === 'RESEND_LIMIT_EXCEEDED') {
          showAlert('⏳ ' + (data.message || 'Too many requests. Please wait 10 minutes.'), 'info');
        } else if (data.code === 'RATE_LIMIT_EXCEEDED') {
          showAlert('⏳ ' + (data.message || 'Too many attempts. Please try again later.'), 'error');
        } else {
          showAlert('❌ ' + (data.message || 'Failed to resend OTP.'), 'error');
        }
      }
    })
    .catch(error => {
      link.style.pointerEvents = 'auto';
      link.textContent = 'Resend OTP';
      showAlert('❌ Network error. Please try again.', 'error');
      console.error('Resend error:', error);
    });
  });

  // ============================================
  // ALERT HELPER
  // ============================================
  function showAlert(message, type = 'info') {
    const container = document.getElementById('alert-container');
    container.innerHTML = '';
    const alert = document.createElement('div');
    alert.className = `alert alert-${type}`;
    alert.textContent = message;
    container.appendChild(alert);

    setTimeout(() => {
      alert.style.opacity = '0';
      alert.style.transition = 'opacity 0.3s';
      setTimeout(() => alert.remove(), 300);
    }, 5000);
  }

  // ============================================
  // ENTER KEY SUPPORT FOR OTP
  // ============================================
  document.getElementById('otp').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
      document.getElementById('verifyForm').dispatchEvent(new Event('submit'));
    }
  });
</script>

</body>
</html>
