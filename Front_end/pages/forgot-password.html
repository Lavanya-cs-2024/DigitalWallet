<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digital Wallet — Forgot Password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/auth.css" />
</head>
<body>

<div class="frame">
  <div class="auth-container">

    <div style="text-align:center; margin-bottom:28px;">
      <a href="/" class="brand" style="justify-content:center;">
        <span class="brand-mark">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 7a2 2 0 0 1 2-2h11a2 2 0 0 1 2 2v1h1a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z" stroke="white" stroke-width="1.6"/>
            <path d="M16 12h3" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </span>
        DIGITAL WALLET
      </a>
    </div>

    <div class="auth-card">
      <div class="auth-header">
        <div class="icon-badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
            <path d="M12 2v4M12 22v-4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M22 12h-4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"/>
          </svg>
        </div>
        <h1>Reset Password</h1>
        <p>We'll send you a code to reset your password</p>
      </div>

      <div id="alert-container"></div>

      <form id="forgotPasswordForm" class="auth-form">
        <div class="field">
          <label for="email">Email Address</label>
          <div class="input-wrap">
            <svg class="leading" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
              <rect x="3" y="5.5" width="18" height="13" rx="2"/>
              <path d="M3.5 6.5 12 13l8.5-6.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <input type="email" id="email" placeholder="Enter your registered email" autocomplete="email" required />
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Send Reset Code</button>
      </form>

      <div class="auth-footer" style="margin-top:20px;">
        <a href="login.html">← Back to Login</a>
      </div>
    </div>
  </div>
</div>

<script>
  document.getElementById('forgotPasswordForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const email = document.getElementById('email').value.trim();

    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      showAlert('Please enter a valid email address', 'error');
      return;
    }

    if (email.length > 100) {
      showAlert('Email must be less than 100 characters', 'error');
      return;
    }

    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Sending...';

    fetch('http://localhost:5000/api/auth/forgot-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    })
    .then(response => response.json())
    .then(data => {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Send Reset Code';

      if (data.success) {
        showAlert('✅ ' + (data.message || 'Reset code sent to your email.'), 'success');
        localStorage.setItem('resetEmail', email);
        setTimeout(() => {
          window.location.href = 'reset-password.html';
        }, 2000);
        return;
      }

      if (data.code === 'RATE_LIMIT_EXCEEDED') {
        handleRateLimit(data, submitBtn);
        return;
      }

      if (data.code === 'PENDING_VERIFICATION') {
        showAlert('⚠️ Please verify your email first. Redirecting...', 'error');
        localStorage.setItem('pendingEmail', email);
        setTimeout(() => {
          window.location.href = 'verify.html';
        }, 2000);
        return;
      }

      if (data.code === 'EMAIL_NOT_FOUND') {
        showAlert('❌ This email is not registered. Please sign up first.', 'error');
        return;
      }

      if (data.code === 'EMAIL_SENT_GENERIC') {
        showAlert('⚠️ ' + (data.message || 'If an account exists, a reset code has been sent.'), 'info');
        return;
      }

      showAlert('❌ ' + (data.message || 'Failed to send reset code.'), 'error');
    })
    .catch(error => {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Send Reset Code';
      showAlert('❌ Network error. Please check if backend is running.', 'error');
      console.error('Forgot password error:', error);
    });
  });

  function handleRateLimit(data, submitBtn) {
    const totalSeconds = data.retryAfter || 900;
    const minutes = data.retryAfterMinutes || Math.ceil(totalSeconds / 60);

    showAlert(`⏳ Too many requests. Please try again in ${minutes} minute${minutes > 1 ? 's' : ''}.`, 'error');

    submitBtn.disabled = true;
    let remainingSeconds = totalSeconds;

    const updateButton = () => {
      const mins = Math.floor(remainingSeconds / 60);
      const secs = remainingSeconds % 60;
      submitBtn.textContent = `Try again in ${mins}:${secs.toString().padStart(2, '0')}`;
    };

    updateButton();

    const countdown = setInterval(() => {
      remainingSeconds--;
      if (remainingSeconds <= 0) {
        clearInterval(countdown);
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send Reset Code';
        showAlert('✅ You can try again.', 'info');
        return;
      }
      updateButton();
    }, 1000);
  }

  function showAlert(message, type = 'info') {
    const container = document.getElementById('alert-container');
    container.innerHTML = '';
    const alert = document.createElement('div');
    alert.className = `alert alert-${type}`;
    alert.textContent = message;
    container.appendChild(alert);

    setTimeout(() => {
      alert.style.opacity = '0';
      alert.style.transition = 'opacity 0.3s';
      setTimeout(() => alert.remove(), 300);
    }, 5000);
  }
</script>

</body>
</html>
