<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SplitWise — Login</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <style>
    /* ========================================
       CSS VARIABLES
    ======================================== */
    :root {
      --bg-0: #0e0716;
      --bg-1: #170a24;
      --stroke: rgba(168, 120, 255, 0.16);
      --stroke-strong: rgba(168, 120, 255, 0.28);
      --violet-1: #7c3aed;
      --violet-2: #c026d3;
      --magenta: #e63cc2;
      --text-hi: #f3eefc;
      --text-mid: #b7a9cf;
      --text-low: #8779a3;
      --gold: #f0b84f;
      --success: #5eea9a;
      --danger: #f77b7b;
      --field-bg: #150a20;
    }

    /* ========================================
       RESET & BASE
    ======================================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(ellipse 900px 500px at 12% 8%, rgba(124, 58, 237, 0.25), transparent 60%),
        radial-gradient(ellipse 700px 600px at 85% 90%, rgba(230, 60, 194, 0.14), transparent 55%),
        linear-gradient(160deg, var(--bg-0), var(--bg-1) 60%, #0c0512);
      font-family: 'Inter', sans-serif;
      color: var(--text-hi);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* ========================================
       AUTH CONTAINER
    ======================================== */
    .auth-container {
      width: 100%;
      max-width: 440px;
    }

    /* ========================================
       BRAND
    ======================================== */
    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-family: 'Sora', sans-serif;
      font-weight: 700;
      letter-spacing: 0.06em;
      font-size: 18px;
      color: var(--text-hi);
      text-decoration: none;
      margin-bottom: 28px;
    }

    .brand-mark {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--violet-1), var(--magenta));
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 18px -4px rgba(192, 38, 211, 0.6);
      font-size: 20px;
      color: #fff;
    }

    /* ========================================
       AUTH CARD
    ======================================== */
    .auth-card {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.035), rgba(255, 255, 255, 0.01));
      border: 1px solid var(--stroke-strong);
      border-radius: 24px;
      padding: 36px 32px 32px;
      box-shadow: 0 30px 80px -20px rgba(70, 10, 120, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }

    /* ========================================
       AUTH HEADER
    ======================================== */
    .auth-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .auth-header .icon-badge {
      width: 56px;
      height: 56px;
      margin: 0 auto 14px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--violet-1), var(--magenta));
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 24px -6px rgba(192, 38, 211, 0.55);
      font-size: 24px;
      color: #fff;
    }

    .auth-header h1 {
      font-family: 'Sora', sans-serif;
      font-size: 24px;
      margin: 0 0 6px;
      font-weight: 700;
    }

    .auth-header p {
      font-size: 13px;
      color: var(--text-low);
      margin: 0;
    }

    /* ========================================
       FORM
    ======================================== */
    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .field {
      margin-bottom: 0;
    }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-mid);
      margin-bottom: 5px;
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrap .leading {
      position: absolute;
      left: 13px;
      width: 16px;
      height: 16px;
      color: var(--text-low);
      pointer-events: none;
      font-size: 16px;
    }

    .input-wrap input {
      width: 100%;
      padding: 12px 14px 12px 40px;
      background: var(--field-bg);
      border: 1px solid var(--stroke);
      border-radius: 11px;
      color: var(--text-hi);
      font-size: 13.5px;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .input-wrap input::placeholder {
      color: var(--text-low);
      font-size: 13px;
    }

    .input-wrap input:focus {
      border-color: var(--magenta);
      box-shadow: 0 0 0 3px rgba(230, 60, 194, 0.15);
    }

    .input-wrap .toggle-eye {
      position: absolute;
      right: 13px;
      width: 16px;
      height: 16px;
      color: var(--text-low);
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      transition: color 0.15s;
    }

    .input-wrap .toggle-eye:hover {
      color: var(--text-mid);
    }

    /* ========================================
       FORGOT PASSWORD LINK
    ======================================== */
    .forgot-link {
      text-align: right;
      margin-top: -4px;
      margin-bottom: 4px;
    }

    .forgot-link a {
      color: var(--magenta);
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
      transition: 0.15s;
    }

    .forgot-link a:hover {
      text-decoration: underline;
    }

    /* ========================================
       BUTTONS
    ======================================== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 24px;
      border: none;
      border-radius: 12px;
      font-family: 'Sora', sans-serif;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.15s ease;
      text-decoration: none;
      width: 100%;
    }

    .btn-primary {
      background: linear-gradient(90deg, var(--violet-1), var(--magenta));
      color: #fff;
      box-shadow: 0 14px 30px -10px rgba(192, 38, 211, 0.55);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 34px -8px rgba(192, 38, 211, 0.65);
    }

    /* ========================================
       DIVIDER
    ======================================== */
    .auth-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 22px 0 18px;
      font-size: 11.5px;
      color: var(--text-low);
    }

    .auth-divider::before,
    .auth-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--stroke);
    }

    /* ========================================
       SOCIAL ROW - GOOGLE ONLY
    ======================================== */
    .social-row {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .social-btn {
      flex: 1;
      max-width: 280px;
      height: 48px;
      border-radius: 11px;
      border: 1px solid var(--stroke);
      background: rgba(255, 255, 255, 0.03);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-mid);
      padding: 0 20px;
    }

    .social-btn:hover {
      border-color: rgba(168, 120, 255, 0.5);
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-hi);
      transform: translateY(-1px);
      box-shadow: 0 4px 20px -8px rgba(124, 58, 237, 0.3);
    }

    .social-btn:active {
      transform: translateY(0);
    }

    .social-btn svg {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
    }

    .social-btn span {
      color: var(--text-mid);
      font-weight: 500;
      font-size: 13px;
      letter-spacing: 0.01em;
    }

    .social-btn:hover span {
      color: var(--text-hi);
    }

    /* Google button specific */
    .social-btn.google-btn {
      background: rgba(255, 255, 255, 0.04);
      border-color: var(--stroke-strong);
    }

    .social-btn.google-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(168, 120, 255, 0.6);
      box-shadow: 0 4px 24px -8px rgba(124, 58, 237, 0.4);
    }

    /* ========================================
       AUTH FOOTER
    ======================================== */
    .auth-footer {
      text-align: center;
      margin-top: 22px;
      font-size: 13px;
      color: var(--text-mid);
      padding-top: 4px;
    }

    .auth-footer a {
      color: var(--magenta);
      text-decoration: none;
      font-weight: 600;
    }

    .auth-footer a:hover {
      text-decoration: underline;
    }

    /* ========================================
       ALERT
    ======================================== */
    #alert-container {
      margin-bottom: 16px;
    }

    .alert {
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 8px;
      animation: slideDown 0.3s ease;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .alert-error {
      background: rgba(247, 123, 123, 0.15);
      border: 1px solid rgba(247, 123, 123, 0.3);
      color: var(--danger);
    }

    .alert-success {
      background: rgba(94, 234, 154, 0.15);
      border: 1px solid rgba(94, 234, 154, 0.3);
      color: var(--success);
    }

    .alert-info {
      background: rgba(124, 58, 237, 0.15);
      border: 1px solid rgba(124, 58, 237, 0.3);
      color: var(--violet-1);
    }

    /* ========================================
       RESPONSIVE
    ======================================== */
    @media (max-width: 480px) {
      .auth-card {
        padding: 24px 18px 20px;
      }

      .social-row {
        flex-direction: column;
        align-items: center;
      }

      .social-btn {
        max-width: 100%;
        width: 100%;
      }

      .auth-header h1 {
        font-size: 20px;
      }

      .brand {
        font-size: 16px;
      }

      .forgot-link {
        text-align: left;
      }
    }
  </style>
</head>
<body>

<div class="auth-container">

  <!-- ===== BRAND ===== -->
  <a href="../index.html" class="brand">
    <span class="brand-mark"><i class="bi bi-wallet2"></i></span>
    SplitWise
  </a>

  <!-- ===== AUTH CARD ===== -->
  <div class="auth-card">

    <!-- ===== HEADER ===== -->
    <div class="auth-header">
      <div class="icon-badge"><i class="bi bi-box-arrow-in-right"></i></div>
      <h1>Welcome Back</h1>
      <p>Log in to your SplitWise account</p>
    </div>

    <!-- ===== ALERT CONTAINER ===== -->
    <div id="alert-container"></div>

    <!-- ===== FORM ===== -->
    <form id="loginForm" class="auth-form">

      <!-- Email -->
      <div class="field">
        <label for="email">Email Address</label>
        <div class="input-wrap">
          <i class="bi bi-envelope leading"></i>
          <input type="email" id="email" placeholder="Enter your email" autocomplete="email" required />
        </div>
      </div>

      <!-- Password -->
      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <i class="bi bi-lock leading"></i>
          <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required />
          <button type="button" class="toggle-eye" data-target="password" aria-label="Show password">
            <i class="bi bi-eye"></i>
          </button>
        </div>
      </div>

      <!-- Forgot Password Link -->
      <div class="forgot-link">
        <a href="forgot-password.html">Forgot password?</a>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn btn-primary spacer-8">
        <i class="bi bi-box-arrow-in-right"></i> Log In
      </button>

    </form>

    <!-- ===== DIVIDER ===== -->
    <div class="auth-divider">or continue with</div>

    <!-- ===== SOCIAL LOGIN - GOOGLE ONLY ===== -->
    <div class="social-row">
      <button class="social-btn google-btn" id="googleLoginBtn" aria-label="Continue with Google">
        <svg viewBox="0 0 48 48" width="24" height="24">
          <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/>
          <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 16.3 4 9.6 8.3 6.3 14.7z"/>
          <path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.9 14.3-5.1l-6.6-5.6C29.6 34.8 26.9 36 24 36c-5.2 0-9.6-3.1-11.3-7.9l-6.6 5.1C9.5 39.6 16.2 44 24 44z"/>
          <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.7l6.6 5.6C40.9 36.5 44 30.9 44 24c0-1.3-.1-2.7-.4-3.5z"/>
        </svg>
        <span>Continue with Google</span>
      </button>
    </div>

    <!-- ===== FOOTER ===== -->
    <div class="auth-footer">
      Don't have an account? <a href="register.html">Create one now</a>
    </div>

  </div>
</div>

<!-- ========================================
   SCRIPTS
======================================== -->
<script>
  // ========================================
  // GOOGLE LOGIN
  // ========================================
  document.getElementById('googleLoginBtn').addEventListener('click', function() {
    // Store redirect info
    localStorage.setItem('auth_redirect', window.location.pathname);
    
    // In production, redirect to backend
    // window.location.href = 'http://localhost:5000/auth/google';
    
    // For demo: Show info message
    showAlert('🚀 Google login coming soon! (Backend integration needed)', 'info');
  });

  // ========================================
  // PASSWORD TOGGLE
  // ========================================
  document.querySelectorAll('.toggle-eye').forEach(btn => {
    btn.addEventListener('click', function() {
      const input = document.getElementById(this.dataset.target);
      const icon = this.querySelector('i');
      if (input) {
        if (input.type === 'password') {
          input.type = 'text';
          icon.className = 'bi bi-eye-slash';
        } else {
          input.type = 'password';
          icon.className = 'bi bi-eye';
        }
      }
    });
  });

  // ========================================
  // FORM SUBMIT
  // ========================================
  document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    // Validation
    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      showAlert('Please enter a valid email address', 'error');
      return;
    }

    if (!password || password.length < 6) {
      showAlert('Please enter your password (min 6 characters)', 'error');
      return;
    }

    // Success
    showAlert('✅ Login successful! Redirecting...', 'success');
    setTimeout(() => {
      window.location.href = 'dashboard.html';
    }, 1500);
  });

  // ========================================
  // ALERT HELPER
  // ========================================
  function showAlert(message, type = 'info') {
    const container = document.getElementById('alert-container');
    container.innerHTML = '';
    const alert = document.createElement('div');
    alert.className = `alert alert-${type}`;
    alert.textContent = message;
    container.appendChild(alert);

    setTimeout(() => {
      alert.style.opacity = '0';
      alert.style.transition = 'opacity 0.3s';
      setTimeout(() => alert.remove(), 300);
    }, 5000);
  }

  // ========================================
  // CHECK FOR REDIRECT FROM GOOGLE
  // ========================================
  (function checkGoogleRedirect() {
    const urlParams = new URLSearchParams(window.location.search);
    const status = urlParams.get('auth');
    const error = urlParams.get('error');

    if (status === 'success') {
      showAlert('✅ Google authentication successful!', 'success');
      setTimeout(() => {
        window.location.href = 'dashboard.html';
      }, 1500);
    } else if (error === 'google_failed') {
      showAlert('❌ Google authentication failed. Please try again.', 'error');
    }
  })();
</script>

</body>
</html>
