<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SplitWise — Login</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Global Styles -->
  <link rel="stylesheet" href="../css/style.css">
  
  <!-- Auth Styles -->
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body>

<div class="auth-container">

  <!-- ===== BRAND ===== -->
  <a href="../index.html" class="brand">
    <span class="brand-mark"><i class="bi bi-wallet2"></i></span>
    SplitWise
  </a>

  <!-- ===== AUTH CARD ===== -->
  <div class="auth-card">

    <!-- ===== HEADER ===== -->
    <div class="auth-header">
      <div class="icon-badge"><i class="bi bi-box-arrow-in-right"></i></div>
      <h1>Welcome Back</h1>
      <p>Log in to your SplitWise account</p>
    </div>

    <!-- ===== ALERT CONTAINER ===== -->
    <div id="alert-container"></div>

    <!-- ===== FORM ===== -->
    <form id="loginForm" class="auth-form">

      <!-- Email -->
      <div class="field">
        <label for="email">Email Address</label>
        <div class="input-wrap">
          <i class="bi bi-envelope leading"></i>
          <input type="email" id="email" placeholder="Enter your email" autocomplete="email" required />
        </div>
      </div>

      <!-- Password -->
      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <i class="bi bi-lock leading"></i>
          <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required />
          <button type="button" class="toggle-eye" data-target="password" aria-label="Show password">
            <i class="bi bi-eye"></i>
          </button>
        </div>
      </div>

      <!-- Forgot Password Link -->
      <div class="forgot-link">
        <a href="forgot-password.html">Forgot password?</a>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn btn-primary btn-block" style="margin-top: 8px;">
        <i class="bi bi-box-arrow-in-right"></i> Log In
      </button>

    </form>

    <!-- ===== DIVIDER ===== -->
    <div class="auth-divider">or continue with</div>

    <!-- ===== SOCIAL LOGIN - GOOGLE ===== -->
    <div class="social-row">
      <button class="social-btn google-btn" id="googleLoginBtn" aria-label="Continue with Google">
        <svg viewBox="0 0 48 48" width="20" height="20">
          <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/>
          <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 16.3 4 9.6 8.3 6.3 14.7z"/>
          <path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.9 14.3-5.1l-6.6-5.6C29.6 34.8 26.9 36 24 36c-5.2 0-9.6-3.1-11.3-7.9l-6.6 5.1C9.5 39.6 16.2 44 24 44z"/>
          <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.7l6.6 5.6C40.9 36.5 44 30.9 44 24c0-1.3-.1-2.7-.4-3.5z"/>
        </svg>
        <span>Continue with Google</span>
      </button>
    </div>

    <!-- ===== FOOTER ===== -->
    <div class="auth-footer">
      Don't have an account? <a href="register.html">Create one now</a>
    </div>

  </div>
</div>

<!-- ========================================
   SCRIPTS
======================================== -->
<script>
  // ========================================
  // GOOGLE LOGIN
  // ========================================
  document.getElementById('googleLoginBtn').addEventListener('click', function() {
    localStorage.setItem('auth_redirect', window.location.pathname);
    showAlert('🚀 Google login coming soon! (Backend integration needed)', 'info');
  });

  // ========================================
  // PASSWORD TOGGLE
  // ========================================
  document.querySelectorAll('.toggle-eye').forEach(btn => {
    btn.addEventListener('click', function() {
      const input = document.getElementById(this.dataset.target);
      const icon = this.querySelector('i');
      if (input) {
        if (input.type === 'password') {
          input.type = 'text';
          icon.className = 'bi bi-eye';
        } else {
          input.type = 'password';
          icon.className = 'bi bi-eye-slash';
        }
      }
    });
  });

  // ========================================
  // FORM SUBMIT
  // ========================================
  document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    // ============================================
    // 1. FRONTEND VALIDATION
    // ============================================
    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      showAlert('Please enter a valid email address', 'error');
      return;
    }
    if (!password || password.length < 6) {
      showAlert('Please enter your password (min 6 characters)', 'error');
      return;
    }

    // ============================================
    // 2. SEND TO BACKEND API
    // ============================================
    const loginBtn = this.querySelector('button[type="submit"]');
    loginBtn.disabled = true;
    loginBtn.innerHTML = '<i class="bi bi-hourglass-split"></i> Logging in...';

    fetch('http://localhost:5000/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    })
    .then(response => response.json())
    .then(data => {
      loginBtn.disabled = false;
      loginBtn.innerHTML = '<i class="bi bi-box-arrow-in-right"></i> Log In';

      // ============================================
      // ✅ SUCCESS
      // ============================================
      if (data.success) {
        // Store tokens and user data
        if (data.data?.tokens) {
          localStorage.setItem('accessToken', data.data.tokens.accessToken);
          localStorage.setItem('refreshToken', data.data.tokens.refreshToken);
        }
        if (data.data?.user) {
          localStorage.setItem('user', JSON.stringify(data.data.user));
        }
        if (data.data?.wallet) {
          localStorage.setItem('wallet', JSON.stringify(data.data.wallet));
        }

        showAlert('✅ Login successful! Redirecting...', 'success');
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 1500);
        return;
      }

      // ============================================
      // ✅ Handle RATE_LIMIT_EXCEEDED
      // ============================================
      if (data.code === 'RATE_LIMIT_EXCEEDED') {
        handleRateLimit(data, loginBtn);
        return;
      }

      // ============================================
      // ✅ Handle PENDING_VERIFICATION
      // ============================================
      if (data.code === 'PENDING_VERIFICATION') {
        localStorage.setItem('pendingEmail', email);
        localStorage.setItem('autoResendOTP', 'true'); 
        showAlert('⚠️ Please verify your email. Redirecting to verification page...', 'error');
        setTimeout(() => {
          window.location.href = 'verify.html';
        }, 2000);
        return;
      }

      // ============================================
      // ✅ Handle other errors
      // ============================================
      showAlert('❌ ' + (data.message || 'Invalid email or password.'), 'error');
    })
    .catch(error => {
      loginBtn.disabled = false;
      loginBtn.innerHTML = '<i class="bi bi-box-arrow-in-right"></i> Log In';
      showAlert('❌ Network error. Please check if backend is running.', 'error');
      console.error('Login error:', error);
    });
  });

  // ========================================
  // ✅ RATE LIMIT HANDLER
  // ========================================
  function handleRateLimit(data, loginBtn) {
    const totalSeconds = data.retryAfter || 900;
    const minutes = data.retryAfterMinutes || Math.ceil(totalSeconds / 60);

    // Show rate limit message
    showAlert(
      `⏳ Too many login attempts. Please try again in ${minutes} minute${minutes > 1 ? 's' : ''}.`,
      'error'
    );

    // Disable login button
    loginBtn.disabled = true;

    // Start countdown
    let remainingSeconds = totalSeconds;

    const updateButton = () => {
      const mins = Math.floor(remainingSeconds / 60);
      const secs = remainingSeconds % 60;
      loginBtn.innerHTML = `<i class="bi bi-hourglass-split"></i> Try again in ${mins}:${secs.toString().padStart(2, '0')}`;
    };

    updateButton();

    const countdown = setInterval(() => {
      remainingSeconds--;

      if (remainingSeconds <= 0) {
        clearInterval(countdown);
        loginBtn.disabled = false;
        loginBtn.innerHTML = '<i class="bi bi-box-arrow-in-right"></i> Log In';
        showAlert('✅ You can try logging in again.', 'info');
        return;
      }

      updateButton();
    }, 1000);
  }

  // ========================================
  // ALERT HELPER
  // ========================================
  function showAlert(message, type = 'info') {
    const container = document.getElementById('alert-container');
    container.innerHTML = '';
    const alert = document.createElement('div');
    alert.className = `alert alert-${type}`;
    alert.textContent = message;
    container.appendChild(alert);

    setTimeout(() => {
      alert.style.opacity = '0';
      alert.style.transition = 'opacity 0.3s';
      setTimeout(() => alert.remove(), 300);
    }, 5000);
  }

   // ============================================
    // GOOGLE LOGIN BUTTON
    // ============================================
    document.getElementById('googleLoginBtn').addEventListener('click', function() {
        // Redirect to backend Google auth endpoint
        window.location.href = 'http://localhost:5000/api/auth/google';
    });

    // ============================================
    // CHECK FOR GOOGLE CALLBACK
    // ============================================
    (function checkGoogleCallback() {
        const urlParams = new URLSearchParams(window.location.search);
        const authStatus = urlParams.get('auth');
        const error = urlParams.get('error');
        const accessToken = urlParams.get('accessToken');
        const refreshToken = urlParams.get('refreshToken');
        const userId = urlParams.get('userId');

        // Success case
        if (authStatus === 'success' && accessToken) {
            // Save tokens
            localStorage.setItem('accessToken', accessToken);
            localStorage.setItem('refreshToken', refreshToken);
            localStorage.setItem('userId', userId);
            window.location.href = 'dashboard.html';

            // Fetch user profile
            fetch('http://localhost:5000/api/auth/me', {
                headers: {
                    'Authorization': `Bearer ${accessToken}`
                }
            })
            .then(res => res.json())
            .then(data => {
                if (data.success && data.data?.user) {
                    localStorage.setItem('user', JSON.stringify(data.data.user));
                    if (data.data.wallet) {
                        localStorage.setItem('wallet', JSON.stringify(data.data.wallet));
                    }

                    showAlert('✅ Google login successful! Redirecting...', 'success');

                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1500);
                }
            })
            .catch(err => {
                console.error('Profile fetch failed:', err);
                showAlert('❌ Failed to load profile', 'error');
            });

            // Clean URL
            window.history.replaceState({}, document.title, window.location.pathname);
            return;
        }

        // Error case
        if (error === 'google_failed') {
            showAlert('❌ Google authentication failed. Please try again.', 'error');
            window.history.replaceState({}, document.title, window.location.pathname);
        } else if (error === 'no_code') {
            showAlert('❌ Authentication cancelled.', 'error');
            window.history.replaceState({}, document.title, window.location.pathname);
        }
    })();
</script>

</body>
</html>
